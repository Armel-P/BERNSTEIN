apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          image: ${REGISTRY}/result:${TAG}
          ports:
            - containerPort: 80
          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_HOST }
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_PORT }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: app-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres, key: POSTGRES_PASSWORD }
          readinessProbe:
            httpGet: { path: /readyz, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: result
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  selector:
    app: result
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: result
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: result
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: result
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: result
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
